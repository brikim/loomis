{
    "plex": {
        "servers": [
            {
                "server_name": "Server1",
                "tracearr_server_name": "TracearrPlexServer1",
                "url": "http://0.0.0.0:32400",
                "api_key": "",
                "tracker_url": "http://0.0.0.0:0",
                "tracker_api_key": "",
                "media_path": "/media/"
            },
            {
                "server_name": "Server2",
                "tracearr_server_name": "TracearrPlexServer2",
                "media_path": "/media/",
                "url": "http://0.0.0.0:32401",
                "api_key": "",
                "tracker_url": "http://0.0.0.0:0",
                "tracker_api_key": ""
            }
        ]
    },

    "emby": {
        "servers": [
            {
                "server_name": "Server1",
                "tracearr_server_name": "TracearrEmbyServer1",
                "url": "http://0.0.0.0:8096",
                "api_key": "",
                "tracker_url": "http://0.0.0.0:0",
                "tracker_api_key": "",
                "media_path": "/media/"
            },
            {
                "server_name": "Server2",
                "tracearr_server_name": "TracearrEmbyServer2",
                "url": "http://0.0.0.0:8097",
                "api_key": "",
                "tracker_url": "http://0.0.0.0:0",
                "tracker_api_key": "",
                "media_path": "/media/"
            }
        ],
    },

    "tracearr": {
        "server_name": "Server",
        "url": "http://0.0.0.0:3000",
        "api_key": ""
    },

    "apprise_logging": {
        "enabled": true,
        "url": "http://0.0.0.0:0",
        "key": "apprise",
        "message_title": "Test loomis notification"
    },

    "gotify_logging": {
        "enabled": true,
        "url": "http://0.0.0.0:0",
        "key": "",
        "message_title": "Test loomis notification",
        "priority": 5
    },

    "playlist_sync": {
        "enabled": false,
        "cron_comment": "Non-Standard cron expression. First digit is seconds so leave this as 0 if this accuracy is not needed and fill in the rest with standard cron expression",
        "cron": "0 0 */2 * * *",
        "time_for_emby_to_update_seconds": 1,
        "time_between_syncs_seconds": 1,
        "plex_collection_sync": [
            {"server": "Server1", "library": "Server1_LibraryName", "collection_name": "plexCollectionName", "target_emby_servers": [{"server": "Server1"}, {"server": "Server2"}]}
        ]
    },

    "state_sync": {
        "enabled": true,
        "dry_run": true,
        "cron": "*/1 * * * * *"
    },

    "filesystem_cleanup": {
        "enabled": true,
        "dry_run": true,
        "cron": "0 0 */2 * * *",
        "empty_folder_delete": {
            "paths": [
                {
                    "path": "pathToMedia", 
                    "plex": [
                        {"server": "Server1", "library_name": "libraryToScan"}
                    ],
                    "emby": [
                        {"server": "Server1", "library_name": "libraryToScan"},
                        {"server": "Server2", "library_name": "libraryToScan"}
                    ]
                }
            ],
            "_comment_ignore_folder_in_check": "Folders to ignore for the path to be considered empty",
            "ignore_folder_in_empty_check": [
                {"ignore": "someFolderToIgnore"}
            ],
            "_comment_ignore_files_in_check": "Files to ignore for the path to be considered empty",
            "ignore_file_in_empty_check": [
                {"ignore": "someFileToIgnore"}
            ]
        },
        "delete_files_by_age": {
            "paths": [
                {
                    "path": "pathToFolder",
                    "delete_age_hours": 4,
                    "valid_extensions_to_delete": [
                        {"extension": "ts"},
                        {"extension": "mkv"}
                    ]
                }
            ]
        }
    },

    "dvr_maintainer": {
        "enabled": true,
        "dry_run": true,
        "cron": "0 0 */2 * * *",
        "_comment": "shows actions include KEEP_LAST_ followed by an integer of total shows to keep and KEEP_LENGTH_DAYS_ followed by an integer of days",
        "libraries": [
            {
                "plex": [
                    {"server": "Server1", "library_name": "libraryToUpdate"}
                ],
                "emby": [
                    {"server": "Server1", "library_name": "libraryToUpdate"},
                    {"server": "Server2", "library_name": "libraryToUpdate"}
                ],
                "path": "/pathUtilitiesToMedia",
                "actions": [
                    {"name": "DirectoryNameInUtilitiesLibraryPath", "action": "KEEP_LAST_5"},
                    {"name": "DirectoryNameInUtilitiesLibraryPath2", "action": "KEEP_LENGTH_DAYS_7"}
                ],
                "extensions_to_delete": [
                    {"extension": "mkv"},
                    {"extension": "ts"}
                ]
            },
            {
                "plex": [
                    {"server": "Server1", "library_name": "libraryToUpdate"}
                ],
                "emby": [
                    {"server": "Server1", "library_name": "libraryToUpdate"},
                    {"server": "Server2", "library_name": "libraryToUpdate"}
                ],
                "path": "/pathUtilitiesToMedia2",
                "actions": [
                    {"name": "DirectoryNameInUtilitiesLibraryPath", "action": "KEEP_LAST_5"},
                    {"name": "DirectoryNameInUtilitiesLibraryPath2", "action": "KEEP_LENGTH_DAYS_7"}
                ],
                "extensions_to_delete": [
                    {"extension": "mkv"},
                    {"extension": "ts"}
                ]
            }
        ]
    },

    "delete_watched": {
        "enabled": true,
        "dry_run": false,
        "cron": "0 0 */2 * * *",
        "delete_time_hours": 24,
        "libraries": [
            {
                "path": "/pathUtilitiesToMedia",
                "plex": [
                    {
                        "server": "Server1",
                        "library_name": "PlexLibraryName",
                        "container_path": "/pathPlexUsesForMedia",
                        "users": [
                            {"name": "User1"},
                            {"name": "User2"}
                        ]
                    }
                ],
                "emby": [
                    {
                        "server": "Server1",
                        "library_name": "EmbyLibraryName",
                        "media_path": "/pathEmbyUsesForMedia"
                        "users": [
                            {"name": "User1"},
                            {"name": "User2"},
                            {"name": "User3"}
                        ]
                    },
                    {
                        "server": "Server2",
                        "library_name": "EmbyLibraryName",
                        "media_path": "/pathEmbyUsesForMedia",
                        "users": [
                            {"name": "User1"}
                        ]
                    }
                ]
            }
        ]
    },

    "emby_tidy": {
        "enabled": true,
        "dry_run": false,
        "cron": "0 0 */2 * * *",
        "servers": [
            {
                "server": "Server1",
                "clean_up_non_local_backdrops": true,
                "local_backdrop_container_start_path": "/embyContainerBaseFolderPath",
                "libraries": [
                    {"library": "EmbyLibrary"}
                ]
            }
        ]
    }
}